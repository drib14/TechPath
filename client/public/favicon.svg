<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#312e81" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Background Circuit Accent Lines -->
  <path d="M120 180 L200 180 L256 236" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-linecap="round" />
  <path d="M392 332 L312 332 L256 276" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-linecap="round" />
  <circle cx="120" cy="180" r="8" fill="rgba(255,255,255,0.25)" />
  <circle cx="392" cy="332" r="8" fill="rgba(255,255,255,0.25)" />

  <!-- TechPath Main Symbol: Pathway / Branching Tech Nodes + Forward Dynamic T & P Monogram -->
  <g filter="url(#glow)">
    <!-- Main Path Spine -->
    <path
      d="M168 136 L344 136 C366 136 380 152 380 174 C380 196 366 212 344 212 L288 212 L288 376 C288 398 270 416 248 416 C226 416 208 398 208 376 L208 212 L168 212 C146 212 128 194 128 172 C128 150 146 136 168 136 Z"
      fill="url(#pathGrad)"
    />

    <!-- Intersecting Learning Route (Circuit Node to Chevron) -->
    <path
      d="M208 288 L320 288 C342 288 360 306 360 328 C360 350 342 368 320 368 L288 368"
      fill="none"
      stroke="url(#accentGlow)"
      stroke-width="24"
      stroke-linecap="round"
    />

    <!-- Glowing Waypoint Nodes -->
    <circle cx="208" cy="174" r="16" fill="#4f46e5" />
    <circle cx="288" cy="288" r="14" fill="#06b6d4" />
    <circle cx="360" cy="328" r="12" fill="#4ade80" />
    <circle cx="248" cy="376" r="14" fill="#6366f1" />
  </g>
</svg>
